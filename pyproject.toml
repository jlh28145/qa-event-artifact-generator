[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-event-artifact-generator"
version = "0.1.0"
description = "CLI tool to convert long test recordings into event-based video clips and structured metadata for faster QA workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["qa", "video", "events", "cli", "clip", "metadata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
qa-event-artifact-generator = "qa_event_artifact_generator.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
