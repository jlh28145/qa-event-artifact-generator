[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-event-artifact-generator"
version = "0.1.0"
description = "CLI tool to convert long test recordings into event-based video clips and structured metadata for faster QA workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["qa", "video", "events", "cli", "clip", "metadata"]
authors = [
    {name = "Portfolio Project", email = "portfolio@example.com"},
]
maintainers = [
    {name = "Portfolio Project", email = "portfolio@example.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.scripts]
qa-event-artifact-generator = "qa_event_artifact_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qa_event_artifact_generator*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
